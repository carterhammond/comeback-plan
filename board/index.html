<!doctype html>
<meta charset="utf-8">
<title>Command Board</title>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#131312">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Board">
<meta name="robots" content="noindex,nofollow">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">

<style>
  :root{color-scheme:light dark}
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:#FBFAF8;color:#191817;min-height:100dvh;
       font:15.5px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
       -webkit-font-smoothing:antialiased}
  @media (prefers-color-scheme:dark){body{background:#131312;color:#F0EEEA}}
  #lock{position:fixed;inset:0;z-index:100;display:grid;place-items:center;padding:24px}
  #lock form{width:min(340px,100%)}
  #lock h1{font-size:21px;letter-spacing:-.02em;font-weight:640;margin-bottom:6px}
  #lock p{color:#63615C;font-size:14px;margin-bottom:20px}
  @media (prefers-color-scheme:dark){#lock p{color:#A8A49D}}
  #lock input{width:100%;font:inherit;font-size:16px;padding:13px 14px;border-radius:10px;
        border:1px solid #D4D0C6;background:#fff;color:inherit}
  @media (prefers-color-scheme:dark){#lock input{background:#1B1A19;border-color:#3C3A37}}
  #lock button{width:100%;margin-top:10px;font:inherit;font-size:15px;font-weight:560;
        padding:13px;border-radius:10px;border:0;background:#E4572E;color:#fff;cursor:pointer}
  #lock .bad{color:#BE3A2B;font-size:13.5px;margin-top:12px;min-height:19px}
  @media (prefers-color-scheme:dark){#lock .bad{color:#F0796A}}
</style>
<div id="lock">
  <form id="lockf">
    <h1>Command Board</h1>
    <p>Locked. Enter the phrase once — this device remembers it.</p>
    <input id="pw" type="password" autocomplete="current-password"
           enterkeyhint="go" autocapitalize="off" autocorrect="off" spellcheck="false"
           aria-label="Unlock phrase">
    <button type="submit">Unlock</button>
    <div class="bad" id="bad" role="alert"></div>
  </form>
</div>

  // We cache the DERIVED KEY, never the decrypted board. The board is rebuilt
  // every morning, so caching plaintext would pin this device to a stale day.
  // With the key cached (and the salt stable across builds) each load decrypts
  // whatever was published today, instantly and with no prompt.
  var KEYCACHE='cb:key:v2';
  var b64 = function(s){ var r=atob(s), a=new Uint8Array(r.length);
    for(var i=0;i<r.length;i++) a[i]=r.charCodeAt(i); return a; };
  var tob64 = function(buf){ var a=new Uint8Array(buf), s='';
    for(var i=0;i<a.length;i++) s+=String.fromCharCode(a[i]); return btoa(s); };
  var bad = function(){ var e=document.getElementById('bad'); return e || {}; };

  function boot(json){
    var app;
    try{ app = JSON.parse(json); }
    catch(e){ bad().textContent='Payload was unreadable.'; return; }
    var lock = document.getElementById('lock');
    if(lock) lock.remove();
    document.body.insertAdjacentHTML('beforeend', app.html);
    // The board is written as a module; run it from a blob to keep module semantics.
    var url = URL.createObjectURL(new Blob([app.js], {type:'text/javascript'}));
    import(url).then(function(){ URL.revokeObjectURL(url); })
               .catch(function(e){ document.body.insertAdjacentHTML('beforeend',
                 '<pre style="padding:20px;white-space:pre-wrap">Failed to start: '+String(e)+'</pre>'); });
  }

    return crypto.subtle.decrypt({name:'AES-GCM', iv:b64(IV)}, key, b64(BLOB))
      .then(function(buf){ boot(new TextDecoder().decode(buf)); });

      .then(decryptWith)
      .catch(function(){

        try{ localStorage.removeItem(KEYCACHE); }catch(e){}
        bad().textContent='This device needs the phrase again.';
      });
    return;
  }

    ev.preventDefault();
    var pw=document.getElementById('pw').value;
    if(!pw) return;
    bad().textContent='Unlocking…';
    crypto.subtle.importKey('raw', new TextEncoder().encode(pw), 'PBKDF2', false, ['deriveKey'])
